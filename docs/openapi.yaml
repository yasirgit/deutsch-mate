openapi: 3.1.0
info:
  title: Deutsch Mate Product API
  version: 1.0.0
  summary: Production MVP contract for the NestJS Product API
  description: |
    REST contract for the first public paid release. CEFR values are learning
    estimates, never accredited certification. Tutor SSE sequencing is defined
    in docs/API.md.
  contact:
    name: Deutsch Mate Engineering
  license:
    name: Proprietary
servers:
  - url: https://api.deutschmate.example/v1
    description: Production
  - url: https://api.staging.deutschmate.example/v1
    description: Staging
tags:
  - { name: Health }
  - { name: Identity }
  - { name: Curriculum }
  - { name: Learning }
  - { name: Tutor }
  - { name: Writing }
  - { name: Billing }
  - { name: Privacy }
  - { name: Support }
  - { name: Operations }
security:
  - oidc: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is alive
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, checkedAt: "2026-07-12T12:00:00Z" }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Critical dependencies are ready
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      security: [{ oidc: [profile:read] }]
      responses:
        "200":
          description: Current product user
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Identity]
      operationId: updateCurrentUser
      description: Updates mutable account settings in iam.users using optimistic concurrency and idempotent replay.
      security: [{ oidc: [profile:write] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/UserPatch" }
      responses:
        "200":
          description: Updated product user
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /me/consents/requirements:
    get:
      tags: [Identity]
      operationId: getConsentRequirements
      security: [{ oidc: [profile:read] }]
      responses:
        "200":
          description: Effective required documents and optional purposes
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [documents, purposes]
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/LegalDocumentVersion" }
                  purposes:
                    type: array
                    items: { type: string, enum: [marketing] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/consents:
    get:
      tags: [Identity]
      operationId: listCurrentConsents
      security: [{ oidc: [profile:read] }]
      responses:
        "200":
          description: Latest decision per purpose
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConsentEvent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Identity]
      operationId: recordConsentEvents
      security: [{ oidc: [profile:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { $ref: "#/components/schemas/ConsentEventInput" }
      responses:
        "201":
          description: Append-only consent events
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConsentEvent" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/profile:
    get:
      tags: [Identity]
      operationId: getCurrentProfile
      security: [{ oidc: [profile:read] }]
      responses:
        "200":
          description: Effective append-only profile version
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileVersion" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Identity]
      operationId: updateCurrentProfile
      security: [{ oidc: [profile:write] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: New immutable profile version
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileVersion" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/onboarding:
    get:
      tags: [Identity]
      operationId: getOnboardingState
      security: [{ oidc: [profile:read] }]
      responses:
        "200":
          description: Durable onboarding state
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Identity]
      operationId: updateOnboardingState
      security: [{ oidc: [profile:write] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/OnboardingPatch" }
      responses:
        "200":
          description: Updated onboarding projection
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/onboarding/complete:
    post:
      tags: [Identity]
      operationId: completeOnboarding
      security: [{ oidc: [profile:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Completed state and first unit
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [onboarding, recommendedUnit]
                properties:
                  onboarding: { $ref: "#/components/schemas/OnboardingState" }
                  recommendedUnit: { $ref: "#/components/schemas/UnitSummary" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /curriculum/releases/current:
    get:
      tags: [Curriculum]
      operationId: getCurrentCurriculumRelease
      security: [{ oidc: [learning:read] }]
      parameters: [{ $ref: "#/components/parameters/IfNoneMatch" }]
      responses:
        "200":
          description: Current immutable published release
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurriculumRelease" }
        "304":
          description: Not modified
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /curriculum/releases/{releaseId}/modules:
    get:
      tags: [Curriculum]
      operationId: listCurriculumModules
      security: [{ oidc: [learning:read] }]
      parameters:
        - { $ref: "#/components/parameters/ReleaseId" }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/CefrLevel" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Published modules ordered by release ordinal
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModulePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /curriculum/units/{unitVersionId}:
    get:
      tags: [Curriculum]
      operationId: getCurriculumUnit
      security: [{ oidc: [learning:read] }]
      parameters: [{ $ref: "#/components/parameters/UnitVersionId" }, { $ref: "#/components/parameters/IfNoneMatch" }]
      responses:
        "200":
          description: Published unit and lesson summaries
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "304":
          description: Not modified
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /curriculum/lessons/{lessonVersionId}:
    get:
      tags: [Curriculum]
      operationId: getLesson
      security: [{ oidc: [learning:read] }]
      parameters:
        - { $ref: "#/components/parameters/LessonVersionId" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Published immutable lesson with activities
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "304":
          description: Not modified
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /learning/sessions:
    get:
      tags: [Learning]
      operationId: listLearningSessions
      security: [{ oidc: [learning:read] }]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Own sessions newest activity first
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningSessionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Learning]
      operationId: createLearningSession
      security: [{ oidc: [learning:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningSessionInput" }
      responses:
        "201":
          description: Active learning session
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /learning/sessions/{sessionId}:
    get:
      tags: [Learning]
      operationId: getLearningSession
      security: [{ oidc: [learning:read] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: Own session
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningSession" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
    patch:
      tags: [Learning]
      operationId: updateLearningSession
      security: [{ oidc: [learning:write] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [completed, abandoned] }
      responses:
        "200":
          description: Updated session
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningSession" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /learning/sessions/{sessionId}/attempts:
    post:
      tags: [Learning]
      operationId: submitActivityAttempt
      security: [{ oidc: [learning:write] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityAttemptInput" }
            examples:
              choice:
                value: { activityVersionId: "018fa5c2-7b1d-7abc-8def-0123456789ab", clientAttemptId: "018fa5c3-7b1d-7abc-8def-0123456789ab", attemptNumber: 1, durationMs: 12500, response: { responseKind: choice, response: { selected: [B] } } }
              writing:
                value: { activityVersionId: "018fa5c2-7b1d-7abc-8def-0123456789ab", clientAttemptId: "018fa5c3-7b1d-7abc-8def-0123456789ab", attemptNumber: 1, response: { responseKind: text, textContent: "Ich wohne seit zwei Jahren in Berlin." } }
      responses:
        "201":
          description: Deterministically completed attempt
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityAttempt" }
        "202":
          description: Writing attempt accepted for feedback
          headers:
            Location: { schema: { type: string, format: uri-reference } }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityAttempt" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /learning/attempts/{attemptId}:
    get:
      tags: [Learning]
      operationId: getActivityAttempt
      security: [{ oidc: [learning:read] }]
      parameters: [{ $ref: "#/components/parameters/AttemptId" }]
      responses:
        "200":
          description: Attempt, current score, and released feedback
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityAttempt" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /learning/review-items:
    get:
      tags: [Learning]
      operationId: listReviewItems
      security: [{ oidc: [learning:read] }]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [due, scheduled, completed, suspended], default: due } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Own review projection ordered by due time
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewItemPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /learning/recommendations:
    post:
      tags: [Learning]
      operationId: createNextActivityRecommendation
      security: [{ oidc: [learning:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                preferredKind: { type: string, enum: [lesson, review] }
      responses:
        "201":
          description: Immutable reproducible recommendation run
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /learning/progress:
    get:
      tags: [Learning]
      operationId: getLearningProgress
      security: [{ oidc: [learning:read] }]
      responses:
        "200":
          description: Completion and proficiency evidence, explicitly separate
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tutor/runs:
    post:
      tags: [Tutor]
      operationId: createTutorRun
      security: [{ oidc: [tutor:use] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorRunInput" }
      responses:
        "202":
          description: Queued tutor invocation
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorRunAccepted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tutor/runs/{runId}:
    get:
      tags: [Tutor]
      operationId: getTutorRun
      security: [{ oidc: [tutor:use] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Authoritative durable run status and final safe output
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /tutor/runs/{runId}/events:
    get:
      tags: [Tutor]
      operationId: streamTutorRunEvents
      security: [{ oidc: [tutor:use] }]
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - name: Last-Event-ID
          in: header
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: SSE stream; event ordering and payloads are normative in docs/API.md
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            text/event-stream:
              schema:
                type: string
                examples: ["id: 12\nevent: message.delta\ndata: {\"runId\":\"018fa5c2-7b1d-7abc-8def-0123456789ab\",\"text\":\"Guten\"}\n\n"]
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /writing-feedback/jobs/{attemptId}:
    get:
      tags: [Writing]
      operationId: getWritingFeedbackJob
      security: [{ oidc: [learning:read] }]
      parameters: [{ $ref: "#/components/parameters/AttemptId" }]
      responses:
        "200":
          description: Writing AI job and released feedback
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
