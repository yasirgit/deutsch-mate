          properties:
            source:
              type: string
              enum: [web, ios, android]
              description: Learner-controlled client source; privileged admin is never accepted here.
        - if:
            properties:
              purposeCode: { enum: [terms, privacy] }
            required: [purposeCode]
          then:
            properties:
              documentVersionId: {}
            required: [documentVersionId]
          else:
            properties:
              documentVersionId: false
      unevaluatedProperties: false
