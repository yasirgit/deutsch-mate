      type: object
      allOf:
        - { $ref: "#/components/schemas/ConsentEventBase" }
        - type: object
          required: [id, source, occurredAt]
          properties:
            id: { $ref: "#/components/schemas/UuidV7" }
            source: { type: string, enum: [web, ios, android, admin] }
            occurredAt: { type: string, format: date-time }
        - if:
            properties:
              purposeCode: { enum: [terms, privacy] }
            required: [purposeCode]
          then:
            properties:
              documentVersionId: {}
            required: [documentVersionId]
      unevaluatedProperties: false
