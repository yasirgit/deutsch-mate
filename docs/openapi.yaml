        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
components:
  securitySchemes:
    oidc:
      type: oauth2
      description: Cognito OIDC Authorization Code with PKCE; JWT bearer token.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.deutschmate.example/oauth2/authorize
          tokenUrl: https://auth.deutschmate.example/oauth2/token
          scopes:
            profile:read: Read own account, consent, profile, and onboarding
            profile:write: Change own consent, profile, and onboarding
            learning:read: Read published content and own learning state
            learning:write: Create own sessions, attempts, and recommendations
            tutor:use: Initiate and read own tutor runs
            billing:read: Read own subscription and entitlements
            billing:write: Create own checkout and portal sessions
            privacy:read: Read own privacy workflows
            privacy:write: Create own privacy workflows
            support:write: Create and read own support cases
            content:write: Create immutable draft content versions
            content:review: Review and publish content
            ai:release: Manage approved AI routing releases
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 2048 }, description: Opaque continuation cursor }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[\\x21-\\x7E]+$" } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    IfNoneMatch: { name: If-None-Match, in: header, schema: { type: string, maxLength: 128 } }
    ReleaseId: { name: releaseId, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
    UnitVersionId: { name: unitVersionId, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
    LessonVersionId: { name: lessonVersionId, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
    SessionId: { name: sessionId, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
    AttemptId: { name: attemptId, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
    RunId: { name: runId, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
    PrivacyRequestId: { name: privacyRequestId, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
    CaseId: { name: caseId, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
    AiReleaseId: { name: aiReleaseId, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
  headers:
    RequestId: { description: End-to-end correlation UUID, schema: { type: string, format: uuid } }
    ETag: { description: Strong resource version, schema: { type: string, examples: ['"3"'] } }
    RateLimitLimit: { schema: { type: integer, minimum: 0 } }
    RateLimitRemaining: { schema: { type: integer, minimum: 0 } }
    RateLimitReset: { description: Seconds until reset, schema: { type: integer, minimum: 0 } }
    RetryAfter: { description: Seconds before retry, schema: { type: integer, minimum: 0 } }
  responses:
    BadRequest:
      description: Invalid request syntax, parameters, headers, or schema
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: Missing or invalid bearer token
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Scope, role, ownership disclosure policy, or entitlement denied
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Resource absent or hidden by ownership
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: State, ETag, or idempotency conflict
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Gone:
      description: Stream resume window expired
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unprocessable:
      description: Schema-valid request with a semantically invalid state transition
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    PreconditionRequired:
      description: If-Match is required
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    TooManyRequests:
      description: Rate or entitlement allowance exhausted
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ServiceUnavailable:
      description: Required dependency unavailable
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    UuidV7: { type: string, format: uuid, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$", examples: ["018fa5c2-7b1d-7abc-8def-0123456789ab"] }
    Decimal: { type: string, pattern: "^-?[0-9]+(?:\\.[0-9]+)?$", examples: ["0.85000"] }
    BigInteger: { type: string, pattern: "^-?[0-9]+$", examples: ["1499"] }
    CefrLevel: { type: string, enum: [A1, A2, B1, B2] }
    Skill: { type: string, enum: [reading, listening, writing, vocabulary, grammar] }
    ReleaseStatus: { type: string, enum: [draft, approved, published, retired] }
    AiRunStatus: { type: string, enum: [queued, running, succeeded, blocked, failed, timed_out, cancelled] }
    Page:
      type: object
      required: [nextCursor]
      properties: { nextCursor: { type: [string, "null"] } }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, requestId, code]
      properties:
        type: { type: string, format: uri-reference, examples: ["https://api.deutschmate.example/problems/validation-failed"] }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        requestId: { type: string, format: uuid }
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, code, message]
            properties: { path: { type: string }, code: { type: string }, message: { type: string } }
      example: { type: "https://api.deutschmate.example/problems/validation-failed", title: "Validation failed", status: 400, detail: "One or more fields are invalid.", instance: "/v1/me/profile", requestId: "018fa5c2-7b1d-7abc-8def-0123456789ab", code: validation_failed, errors: [{ path: "/studyDaysPerWeek", code: maximum, message: "Must be at most 7." }] }
    Health:
      type: object
      additionalProperties: false
      required: [status, checkedAt]
